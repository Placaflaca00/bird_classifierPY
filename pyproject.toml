[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bird_classifier_py"
version = "0.0.1"
description = "Audio-based bird species classifier for Paraguay (BirdNET embeddings + PyTorch Lightning head)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Placaflaca00" },
]
keywords = ["bioacoustics", "birds", "paraguay", "birdnet", "pytorch-lightning", "audio-classification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies are intentionally NOT pinned here yet — each surface
# (training notebooks, lambda/, app/) manages its own requirements.
# This [project] block exists so `pip install -e .` makes `src/` importable
# from notebooks running on Google Colab.
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pytest>=8.0",
]
# Pipeline de datos (descarga + curación + validación de metadata).
# Instalar con:  pip install -e ".[data]"
data = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "pandera>=0.20",
]

[project.urls]
Repository = "https://github.com/Placaflaca00/bird_classifierPY"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "notebooks",
    "data",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — formatter handles it
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["N802", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
